<div class="profile-grid">
{% for row in profile.generated_pic %}
    <div class="row">
    {% for pixel in row %} <!-- visual studio code thinks this is a style error but, its correct Django template syntax ... its cursed -->
        <div class="pixel" style="background-color: rgba( {{ pixel.0 }}, {{ pixel.1 }}, {{ pixel.2 }}, {{ pixel.3 }});"></div> 
    {% endfor %}
    </div>
{% endfor %}
</div>
