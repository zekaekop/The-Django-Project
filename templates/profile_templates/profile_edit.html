{% extends 'base.html' %}
{% load static %}

{% block body %}
    <div class="container">
        <div class="row">                       
            {% include 'user_welcome_title.html' %}
            
            <h6>Last Login {{request.user.last_login}}</h6>
            <hr>
            
            <div class="card">
                <div class="col-md-0">
                    
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        
                        <div class="form-group mb-3">
                            <label for="image" class="form-label">Profile Picture</label>
                            <input type="file" name="image" id="profile_pic" class="form-control">
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="bio" class="form-label">Bio</label>
                            <textarea class="form-control" name="bio" id="bio" placeholder="Enter Bio" rows="3" maxlength="400"></textarea>
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" name="location" id="location" class="form-control" placeholder="Enter location">
                        </div>

                        <div class="form-group mb-3">
                            <label for="gender" class="form-label">Gender</label>
                            <input type="text" name="gender" id="gender" class="form-control" placeholder="Enter Gender">
                        </div>
                        
                        <div class="form-group mb-3">
                            <label for="user_age" class="form-label">Age</label>
                            <input type="number" name="user_age" id="user_age" class="form-control" placeholder="Enter Age">
                        </div>

                        <div class=" d-flex">

                        <button type="submit" name="action" value="save" class="btn btn-primary button_shadow m-2">
                                Save Changes
                            </button>

                            <a href="{% url 'user_profile:profile' request.user %}" class="btn btn-primary button_shadow m-2">
                                Go back to profile
                            </a>

                            <div class="ms-auto">
                                <a href="{% url 'user_profile:change_credentials' %}" class="btn btn-primary button_shadow m-2">
                                    Change Credentials
                                </a>
                            </div>

                        </div>

                    </form> 
                </div>
            </div>
        </div>
    </div>
{% endblock %}
