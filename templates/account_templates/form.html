{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block body %}

<div class="container my-5">


    <!-- User Login Form -->
    <div class="row justify-content-center">
        <div class="col-md-3 col-lg-4">
            <div class="card p-2" style="box-shadow: 5px 5px 10px rgba(0, 0, 0, 0.45);">

                <form method="POST" autocomplete="off">
                    <h1 class="text-center text_color">{{ title }}</h1>
                    <hr>

                    {% csrf_token %}
                    {{ form|crispy }}

                    <div class="d-flex justify-content-between align-items-center mt-3">
                        <input class="btn btn-primary button_shadow" type="submit" value="Enter">

                        {% if donthaveaccount %}
                            <a href="{% url 'accounts:signin' %}" class="text_fadded">Don't have an account?</a>
                        {% else %}
                            <a href="{% url 'accounts:login' %}" class="text_fadded">Already have an account?</a>
                        {% endif %}
                    </div>
                </form>

            </div>

                <!-- Site statistics -->
            <div class="row text-center mb-3 mt-2">
                <div class="col-md-6 mb-3 pe-0">
                    <div class="card p-0">
                        <div class="card-body">
                            <small class="text_fadded">Registered Accounts</small>
                            <h4 id="descCounter" class="text_fadded">
                                <span id="currentDescCount">0</span>
                            </h4>
                        </div>
                    </div>
                </div>
                <div class="col-md-6 mb-3 ps-0">
                    <div class="card p-0">
                        <div class="card-body">
                            <small class="text_fadded">Created Posts</small>
                            <h4 id="descCounter" class="text_fadded">
                                <span id="currentDescCount">0</span>
                            </h4>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

{% endblock body %}
